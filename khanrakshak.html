*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#fbfaf6;color:#1b2430;font-size:14px}
button{font-family:inherit;font-size:inherit;border:none;background:none;cursor:pointer;color:inherit}
table{border-collapse:collapse;width:100%}
h1,h2,.serif{font-family:'Playfair Display',serif}

/* top identity strip */
.tricolor{display:flex;height:4px;width:100%}
.tricolor span{flex:1}
.utility-bar{background:#08172a;color:#c9d3dd;font-size:11px;padding:6px 24px;display:flex;justify-content:space-between;align-items:center;letter-spacing:.2px}
.utility-bar b{color:#e8c874;font-weight:600}
.gov-header{background:#0a2540;color:#f4f1e8;padding:16px 24px;display:flex;align-items:center;gap:14px}
.seal{width:46px;height:46px;flex-shrink:0}

/* cards */
.gc-card{background:#ffffff;border:1px solid #e7e1d1;border-radius:12px;box-shadow:0 1px 2px rgba(10,37,64,.05),0 4px 14px rgba(10,37,64,.04);padding:20px}
.gc-card.accent{border-top:3px solid #b8860b}
.gc-inset{background:#faf9f4;border:1px solid #ece6d6;border-radius:10px}
.gc-track{background:#eee9db;border-radius:999px;overflow:hidden;height:8px}
.gc-btn{background:#ffffff;border:1px solid #d9d2bd;border-radius:10px;transition:all .15s ease;cursor:pointer}
.gc-btn:hover{border-color:#b8860b;box-shadow:0 2px 8px rgba(184,134,11,.15)}
.gc-btn-active{background:#0a2540 !important;border-color:#0a2540 !important;color:#e8c874 !important}
.gc-btn-active *{color:#e8c874 !important;stroke:#e8c874 !important}
.gold-btn{background:#0a2540;color:#e8c874;border-radius:10px;border:1px solid #0a2540;cursor:pointer;transition:all .15s ease}
.gold-btn:hover{background:#123a5e}
.gold-btn[disabled]{opacity:.4;cursor:default}

/* layout */
.app{display:flex;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;height:100vh;width:264px;background:#0a2540;padding:0 14px 16px;display:flex;flex-direction:column;z-index:40;transition:transform .2s ease}
.sidebar.hide{transform:translateX(-100%)}
.scrim{display:none;position:fixed;inset:0;background:#0006;z-index:30}
.scrim.show{display:block}
.main{flex:1;min-width:0;margin-left:264px;display:flex;flex-direction:column}
.topbar{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;flex-shrink:0;background:#ffffff;border-bottom:1px solid #e7e1d1}
.content{flex:1;overflow-y:auto;padding:24px}

.pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:6px;display:inline-block;white-space:nowrap;border:1px solid transparent}
.page-header{margin-bottom:22px;border-bottom:1px solid #e7e1d1;padding-bottom:16px}
.page-header .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#9c7a1f}
.page-header h1{font-size:25px;font-weight:700;color:#0a2540;margin-top:4px}
.page-header p{font-size:13px;color:#5b6673;margin-top:6px;max-width:680px;line-height:1.6}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
@media(max-width:1024px){.sidebar{transform:translateX(-100%)}.sidebar.show{transform:translateX(0)}.main{margin-left:0}.scrim{display:none}.scrim.show{display:block}}

.svgicon{display:inline-block;vertical-align:middle}
.stat span{font-size:11px;color:#8a95a3;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.stat b{font-size:26px;display:block;color:#0a2540;margin-top:6px;font-family:'Playfair Display',serif}

/* Live connection banner */
.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid #1e7a4c44;background:#e4f3ea;color:#1e6b47}
.live-badge.offline{background:#fdf2e9;color:#b45309;border-color:#b4530933}
.live-dot{width:7px;height:7px;border-radius:50%;background:#1e7a4c;animation:pulse 2s infinite}
.live-badge.offline .live-dot{background:#b45309;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Modals */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,37,64,.6);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
.modal-box{background:#fff;border-radius:12px;max-width:540px;width:90%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 40px rgba(0,0,0,.2);border:1px solid #e7e1d1;padding:24px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:700;color:#0a2540;margin-bottom:6px}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #d9d2bd;background:#faf9f4;font-family:inherit;font-size:13px;color:#1b2430}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:#b8860b;background:#fff}

    if (res.ok) {
      isBackendLive = true;
      const data = await res.json();
      console.log('✓ Connected to MineGuard AI Live Backend:', data);
    } else {
      isBackendLive = false;
    }
  } catch (e) {
    isBackendLive = false;
    console.log('Running in local/demo mode (Backend offline or not yet started).');
  }
}

async function apiFetch(endpoint, options = {}) {
  options.headers = options.headers || {};
  if (authToken) {
    options.headers['Authorization'] = `Bearer ${authToken}`;
  }
  const url = endpoint.startsWith('http') ? endpoint : `${API_BASE}${endpoint}`;
  try {
    const res = await fetch(url, options);
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || `HTTP error ${res.status}`);
    }
    return await res.json();
  } catch (err) {
    console.warn(`API call failed for ${endpoint}:`, err.message);
    throw err;
  }
}

async function loginAsRole(roleId) {
  const creds = ROLE_CREDENTIALS[roleId];
  if (!creds) return false;

  try {
    const body = new URLSearchParams();
    body.append('username', creds.email);
    body.append('password', creds.pass);

    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString()
    });

    if (res.ok) {
      const data = await res.json();
      authToken = data.access_token;
      localStorage.setItem('mg_auth_token', authToken);
      isBackendLive = true;

      try {
        currentProfile = await apiFetch('/auth/me');
      } catch (e) {
        currentProfile = { email: creds.email, full_name: creds.label, role: roleId };
      }

      await refreshLiveDataset();
      return true;
    }
  } catch (e) {
    console.warn('Backend login unavailable; falling back to demo state.', e);
  }
  return false;
}

async function refreshLiveDataset() {
  if (!isBackendLive || !authToken) return;
  try {
    const [minesData, compData, inspData, auditData] = await Promise.allSettled([
      apiFetch('/mines'),
      apiFetch('/compliance'),
      apiFetch('/inspections'),
      apiFetch('/audit/logs?limit=10')
    ]);

    if (minesData.status === 'fulfilled' && Array.isArray(minesData.value) && minesData.value.length > 0) {
      MINES = minesData.value.map(m => ({
        id: m.id,
        name: m.name,
        state: m.location_name ? m.location_name.split(',')[1]?.trim() || 'India' : 'India',
        operator: m.code.split('-')[0] || 'CIL',
        risk: m.current_risk_score || 45,
        compliance: Math.round(m.statutory_compliance_rate || 88),
        lat: m.center_lat || 20.9525,
        lng: m.center_lon || 85.1525
      }));
    }

    if (compData.status === 'fulfilled' && Array.isArray(compData.value) && compData.value.length > 0) {
      COMPLIANCE_ITEMS = compData.value.map(c => ({
        id: c.requirement?.rule_code || c.id.slice(0, 6),
        mine: c.mine_id ? (MINES.find(m => m.id === c.mine_id)?.name || 'Mine') : 'All Mines',
        category: c.requirement?.category || 'Safety',
        item: c.requirement?.title || 'Statutory Requirement',
        due: c.status === 'OVERDUE' ? 'Overdue' : c.status === 'COMPLIANT' ? 'Compliant' : 'Pending',
        tone: c.status === 'OVERDUE' ? 'red' : c.status === 'COMPLIANT' ? 'green' : 'amber'
      }));
    }

    if (auditData.status === 'fulfilled' && Array.isArray(auditData.value)) {
      AUDIT_LOG = auditData.value.map(a => ({
        time: new Date(a.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        user: a.actor_id ? `User (${a.actor_id.slice(0,8)})` : 'System Engine',
        action: `${a.action}: ${a.entity_type} [${a.entity_id ? a.entity_id.slice(0,8) : 'N/A'}]`,
        hash: a.current_hash ? a.current_hash.slice(0, 8) + '...' + a.current_hash.slice(-4) : 'Verified'
      }));
    }
  } catch (e) {
    console.warn('Dataset synchronization error:', e);
  }
}

let fieldMapInstance = null;
function initFieldMap(){
  const el = document.getElementById('leaflet-map');
  if(!el || typeof L==='undefined') return;
  if(fieldMapInstance){ fieldMapInstance.remove(); fieldMapInstance=null; }
  fieldMapInstance = L.map('leaflet-map', {scrollWheelZoom:false}).setView([23.0,84.0], 5);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
    attribution:'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics',
    maxZoom:19
  }).addTo(fieldMapInstance);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(fieldMapInstance);

  MINES.forEach(m=>{
    L.circleMarker([m.lat,m.lng],{radius:10,color:'#0a2540',weight:2,fillColor:riskColor(m.risk),fillOpacity:.9})
      .addTo(fieldMapInstance)
      .bindPopup('<b>'+m.name+'</b><br>'+m.state+' · '+m.operator+'<br>Risk score: '+m.risk+'/100<br>Compliance: '+m.compliance+'%');
  });

  const dotColor={'Safety observation':'#b8860b',Attendance:'#1e7a4c',Incident:'#8a2331'};
  const shown = FIELD_REPORTS.filter(r=>state.mapFilter==='All'||r.type===state.mapFilter);
  shown.forEach(r=>{
    L.circleMarker([r.lat,r.lng],{radius:5,color:dotColor[r.type],weight:1,fillColor:dotColor[r.type],fillOpacity:.85})
      .addTo(fieldMapInstance)
      .bindPopup(r.mine+' — '+r.type);
  });
}
